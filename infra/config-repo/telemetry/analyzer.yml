spring:
  main:
    web-application-type: none
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/telemetry_analyzer
    username: ${POSTGRES_USER:dbuser}
    password: ${POSTGRES_PASSWORD:12345}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate

analyzer:
  kafka:
    bootstrap-servers: localhost:9092
    hub-group-id: telemetry.analyzer.hubs
    snapshot-group-id: telemetry.analyzer.snapshots
    hub-topic: telemetry.hubs.v1
    snapshot-topic: telemetry.snapshots.v1

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
